# AquaMeter MVP: Oracle Database 23ai Free + API/Dashboard Spring Boot
# Uso: docker compose up --build   →   abrir http://localhost:8080
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: aquameter-oracle
    environment:
      ORACLE_PASSWORD: Aquameter2026
      APP_USER: aquameter
      APP_USER_PASSWORD: aquameter
      TZ: America/Sao_Paulo
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    container_name: aquameter-app
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: aquameter
      DB_PASSWORD: aquameter
      SIMULADOR_ATIVO: "true"
      SIMULADOR_INTERVALO_MS: "60000"
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  oracle-data:
