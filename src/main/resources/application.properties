spring.application.name=aquameter
server.port=8080

# Oracle Database 23ai Free (docker compose). Em produção: OCI Autonomous Database.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:aquameter}
spring.datasource.password=${DB_PASSWORD:aquameter}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Cria o schema (idempotente) a cada inicialização
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

spring.jackson.time-zone=America/Sao_Paulo

# Dados de demonstração (fazenda fictícia com 30 dias de histórico)
aquameter.seed.ativo=${SEED_ATIVO:true}
# Simulador de sensores IoT: gera uma leitura por medidor a cada intervalo
aquameter.simulador.ativo=${SIMULADOR_ATIVO:true}
aquameter.simulador.intervalo-ms=${SIMULADOR_INTERVALO_MS:60000}
# Multiplicador do custo da energia no horário de ponta (18h-21h) usado nas recomendações
aquameter.energia.fator-ponta=2.0
